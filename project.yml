name: LocusUpdate
options:
  objectVersion: 56
  xcodeVersion: "15.0"
  bundleIdPrefix: studio.locusable
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: "0.2.0"
    CURRENT_PROJECT_VERSION: "2"
    PRODUCT_BUNDLE_IDENTIFIER: studio.locusable.LocusUpdate
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_CFBundleDisplayName: LocusUpdate
    INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
    INFOPLIST_KEY_NSHumanReadableCopyright: "Copyright © 2026 Locusable Studio"
    INFOPLIST_KEY_LSUIElement: NO
targets:
  LocusUpdate:
    type: application
    platform: macOS
    sources:
      - path: LocusUpdate
        excludes:
          - "**/*.md"
      - path: Sources/LocusUpdateCore
    settings:
      base:
        PRODUCT_NAME: LocusUpdate
        SWIFT_VERSION: "5.9"
        # Unsigned local Debug builds are expected; see ACCEPTANCE.md
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGNING_ALLOWED: YES
